<template>
    <div lwc:if={accounts.data}>
        <lightning-datatable
            key-field="accountId"
            data={accounts.data}
            columns={accColumns}
            onrowselection={handleRowSelection}
        ></lightning-datatable>
    </div>
    
    <div lwc:if={areCasesAvailable}>
        <div class="slds-var-p-around_medium">
            <h2 class="slds-text-heading_medium">Related Cases</h2>
            <lightning-datatable
                key-field="caseId"
                data={cases}
                columns={caseColumns}
                hide-checkbox-column="true"
            ></lightning-datatable>
        </div>
    </div>
    
    <div lwc:if={areOppsAvailable}>
        <div class="slds-var-p-around_medium">
            <h2 class="slds-text-heading_medium">Related Opportunities</h2>
            <lightning-datatable
                key-field="oppId"
                data={opportunities}
                columns={oppColumns}
                hide-checkbox-column="true"
            ></lightning-datatable>
        </div>
    </div>
</template>
